<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>英検面接シミュレーター</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --primary:#4a90b8;--primary-dark:#35708f;--primary-light:#e8f4f8;
  --accent:#5cb85c;--accent-dark:#449d44;
  --warn:#e8a945;--danger:#d9534f;
  --bg:#f0f5f8;--card:#fff;--text:#2c3e50;--text-light:#6b7b8d;
  --shadow:0 4px 20px rgba(0,0,0,.08);--shadow-lg:0 8px 32px rgba(0,0,0,.12);
  --radius:16px;--radius-sm:10px;
}
html{font-size:16px}
body{
  font-family:'Noto Sans JP','Nunito',sans-serif;
  background:var(--bg);color:var(--text);
  min-height:100dvh;overflow-x:hidden;
  -webkit-tap-highlight-color:transparent;
}
button{font-family:inherit;cursor:pointer;border:none;outline:none;-webkit-appearance:none}
.app{max-width:480px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;position:relative}

/* Header */
.header{
  background:linear-gradient(135deg,var(--primary),var(--primary-dark));
  color:#fff;padding:16px 20px;display:flex;align-items:center;gap:12px;
  position:sticky;top:0;z-index:100;
}
.header h1{font-size:1.1rem;font-weight:700;flex:1}
.header .badge{
  background:rgba(255,255,255,.2);padding:4px 10px;border-radius:20px;
  font-size:.75rem;font-weight:600;
}
.btn-home{
  background:rgba(255,255,255,.15);border-radius:50%;width:36px;height:36px;
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:1.2rem;
  transition:background .2s;
}
.btn-home:hover{background:rgba(255,255,255,.3)}

/* Progress bar */
.progress-bar{
  height:4px;background:rgba(255,255,255,.2);position:relative;
}
.progress-bar .fill{
  height:100%;background:#fff;transition:width .5s ease;border-radius:0 2px 2px 0;
}

/* Main content */
.main{flex:1;padding:20px;display:flex;flex-direction:column;gap:16px}

/* Screen transitions */
.screen{display:none;animation:fadeIn .4s ease}
.screen.active{display:flex;flex-direction:column;gap:16px}
@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.4}}

/* Home screen */
.home-hero{text-align:center;padding:30px 0 10px}
.home-hero .icon{font-size:3.5rem;margin-bottom:12px;display:block}
.home-hero h2{font-size:1.5rem;font-weight:700;margin-bottom:6px}
.home-hero p{color:var(--text-light);font-size:.9rem}

.grade-selector{display:flex;flex-direction:column;gap:10px}
.grade-card{
  background:var(--card);border-radius:var(--radius);padding:18px 20px;
  display:flex;align-items:center;gap:14px;
  box-shadow:var(--shadow);border:2px solid transparent;
  transition:all .25s ease;position:relative;overflow:hidden;
}
.grade-card:hover,.grade-card.selected{border-color:var(--primary);transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.grade-card.selected::after{
  content:'';position:absolute;top:0;left:0;width:100%;height:100%;
  background:var(--primary-light);opacity:.3;pointer-events:none;
}
.grade-card .grade-icon{
  width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;
  font-size:1.3rem;font-weight:700;color:#fff;flex-shrink:0;
}
.grade-card .grade-icon.g3{background:linear-gradient(135deg,#5cb85c,#449d44)}
.grade-card .grade-icon.gp2{background:linear-gradient(135deg,#e8a945,#d4942e)}
.grade-card .grade-icon.g2{background:linear-gradient(135deg,#d9534f,#c9302c)}
.grade-card .grade-info h3{font-size:1rem;font-weight:700}
.grade-card .grade-info p{font-size:.78rem;color:var(--text-light);margin-top:2px}
.grade-card .grade-sets{
  margin-left:auto;font-size:.72rem;color:var(--text-light);
  background:var(--bg);padding:4px 10px;border-radius:12px;white-space:nowrap;
}

.btn-start{
  background:linear-gradient(135deg,var(--primary),var(--primary-dark));
  color:#fff;font-size:1.1rem;font-weight:700;
  padding:16px;border-radius:var(--radius);width:100%;
  box-shadow:0 4px 16px rgba(74,144,184,.3);
  transition:all .25s ease;
}
.btn-start:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(74,144,184,.4)}
.btn-start:disabled{opacity:.5;pointer-events:none}

.history-section{margin-top:8px}
.history-section h3{font-size:.85rem;color:var(--text-light);margin-bottom:8px}
.history-row{
  background:var(--card);border-radius:var(--radius-sm);padding:12px 16px;
  display:flex;align-items:center;gap:10px;font-size:.82rem;
  box-shadow:0 2px 8px rgba(0,0,0,.04);
}
.history-row .stars{color:#f5c518;letter-spacing:2px}
.history-row .date{color:var(--text-light);margin-left:auto;font-size:.72rem}

/* Examiner bubble */
.examiner{display:flex;gap:12px;align-items:flex-start;animation:slideUp .5s ease}
.examiner-avatar{
  width:44px;height:44px;border-radius:50%;flex-shrink:0;
  background:linear-gradient(135deg,var(--primary),var(--primary-dark));
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:1.3rem;
}
.examiner-bubble{
  background:var(--card);border-radius:4px var(--radius) var(--radius) var(--radius);
  padding:14px 18px;box-shadow:var(--shadow);flex:1;
  font-size:.92rem;line-height:1.7;
}
.examiner-bubble .label{font-size:.72rem;color:var(--primary);font-weight:600;margin-bottom:4px}

/* Passage card */
.passage-card{
  background:var(--card);border-radius:var(--radius);padding:24px;
  box-shadow:var(--shadow-lg);border:1px solid #e0e8ee;
  position:relative;
}
.passage-card::before{
  content:'EIKEN Card';position:absolute;top:10px;right:14px;
  font-size:.65rem;color:var(--text-light);font-weight:600;letter-spacing:1px;
  text-transform:uppercase;
}
.passage-card .passage-title{
  font-family:'Nunito',sans-serif;font-size:1.15rem;font-weight:700;
  color:var(--primary-dark);margin-bottom:12px;padding-bottom:10px;
  border-bottom:2px solid var(--primary-light);
}
.passage-card .passage-text{
  font-family:'Nunito','Noto Sans JP',sans-serif;
  font-size:1rem;line-height:1.9;color:var(--text);
}
.passage-card .passage-text .word{
  display:inline;transition:background .3s,color .3s;padding:1px 2px;border-radius:3px;
}
.passage-card .passage-text .word.highlight{background:#c8e6c9;color:#2e7d32}
.passage-card .passage-text .word.missed{background:#ffcdd2;color:#c62828;text-decoration:underline}

/* Timer */
.timer-display{
  text-align:center;padding:16px;
}
.timer-circle{
  width:100px;height:100px;border-radius:50%;margin:0 auto 10px;
  display:flex;align-items:center;justify-content:center;
  font-size:2.2rem;font-weight:700;color:var(--primary);
  border:4px solid var(--primary-light);position:relative;
  font-family:'Nunito',sans-serif;
}
.timer-circle.warning{color:var(--warn);border-color:#fff3cd}
.timer-circle.danger{color:var(--danger);border-color:#f8d7da;animation:pulse .8s infinite}
.timer-label{font-size:.82rem;color:var(--text-light)}

/* Answer area */
.answer-area{display:flex;flex-direction:column;gap:10px}
.answer-textarea{
  width:100%;min-height:80px;border:2px solid #e0e8ee;border-radius:var(--radius-sm);
  padding:12px 16px;font-size:.95rem;font-family:inherit;resize:vertical;
  transition:border-color .2s;line-height:1.6;
}
.answer-textarea:focus{border-color:var(--primary);outline:none}
.answer-textarea::placeholder{color:#b0bec5}

.answer-actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{
  padding:10px 18px;border-radius:var(--radius-sm);font-size:.88rem;font-weight:600;
  transition:all .2s;display:inline-flex;align-items:center;gap:6px;
}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-dark)}
.btn-secondary{background:var(--bg);color:var(--text);border:1px solid #d0d8e0}
.btn-secondary:hover{background:#e0e8ee}
.btn-accent{background:var(--accent);color:#fff}
.btn-accent:hover{background:var(--accent-dark)}
.btn-warn{background:var(--warn);color:#fff}
.btn-danger{background:var(--danger);color:#fff}
.btn-icon{font-size:1.1rem}
.btn-full{width:100%;justify-content:center}
.btn-lg{padding:14px 24px;font-size:1rem}

.btn-mic{
  width:56px;height:56px;border-radius:50%;
  background:var(--danger);color:#fff;font-size:1.5rem;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 16px rgba(217,83,79,.3);
  transition:all .2s;position:relative;
}
.btn-mic.recording{animation:pulse .8s infinite;box-shadow:0 4px 24px rgba(217,83,79,.5)}
.btn-mic:disabled{opacity:.4;pointer-events:none}

.speech-status{
  font-size:.78rem;color:var(--text-light);text-align:center;
  min-height:20px;
}
.speech-status.active{color:var(--danger);animation:blink 1.2s infinite}

/* Model answer */
.model-answer{
  background:linear-gradient(135deg,#e8f5e9,#f1f8e9);
  border-radius:var(--radius);padding:16px 18px;
  border-left:4px solid var(--accent);animation:slideUp .4s ease;
}
.model-answer .label{font-size:.72rem;color:var(--accent-dark);font-weight:700;margin-bottom:6px}
.model-answer .text{font-family:'Nunito','Noto Sans JP',sans-serif;font-size:.95rem;line-height:1.7}
.model-answer .tips{
  margin-top:10px;padding-top:10px;border-top:1px solid rgba(92,184,92,.2);
  font-size:.82rem;color:var(--text-light);
}

/* Self assessment */
.self-assess{display:flex;gap:10px;margin-top:4px}
.self-assess .btn{flex:1;justify-content:center;padding:12px}

/* Step indicator */
.step-indicator{
  display:flex;align-items:center;gap:6px;padding:8px 0;
}
.step-dot{
  width:8px;height:8px;border-radius:50%;background:#d0d8e0;
  transition:all .3s;
}
.step-dot.active{background:var(--primary);width:24px;border-radius:4px}
.step-dot.done{background:var(--accent)}
.step-label{font-size:.72rem;color:var(--text-light);margin-left:auto}

/* Result screen */
.result-card{
  background:var(--card);border-radius:var(--radius);padding:24px;
  box-shadow:var(--shadow);text-align:center;
}
.result-card .big-stars{font-size:2.5rem;letter-spacing:6px;margin:12px 0}
.result-card h2{font-size:1.3rem;margin-bottom:4px}
.result-card .subtitle{color:var(--text-light);font-size:.88rem}

.result-breakdown{display:flex;flex-direction:column;gap:8px}
.result-row{
  background:var(--card);border-radius:var(--radius-sm);padding:14px 16px;
  display:flex;align-items:center;gap:12px;box-shadow:0 2px 8px rgba(0,0,0,.04);
}
.result-row .section-name{flex:1;font-size:.88rem;font-weight:500}
.result-row .section-result{font-size:.82rem;font-weight:600}
.result-row .section-result.good{color:var(--accent)}
.result-row .section-result.ok{color:var(--warn)}
.result-row .section-result.needs-work{color:var(--danger)}

.tips-card{
  background:linear-gradient(135deg,#fff8e1,#fff3e0);
  border-radius:var(--radius);padding:18px;
  border-left:4px solid var(--warn);text-align:left;
}
.tips-card h3{font-size:.9rem;margin-bottom:8px;color:var(--warn)}
.tips-card ul{padding-left:18px;font-size:.84rem;line-height:1.8;color:var(--text)}

.result-actions{display:flex;gap:10px}
.result-actions .btn{flex:1;justify-content:center}

/* Illustration description box */
.illustration-box{
  background:var(--card);border-radius:var(--radius);padding:18px;
  box-shadow:var(--shadow);border:2px dashed #d0d8e0;
  text-align:center;color:var(--text-light);
}
.illustration-box .illust-icon{font-size:2.5rem;margin-bottom:8px;display:block}
.illustration-box .illust-desc{font-size:.85rem;line-height:1.7;font-style:italic}

/* Responsive */
@media(max-width:380px){
  html{font-size:14px}
  .main{padding:14px}
}

/* Dark mode support */
@media(prefers-color-scheme:dark){
  :root{
    --bg:#1a2332;--card:#243447;--text:#e0e8f0;--text-light:#8899aa;
    --shadow:0 4px 20px rgba(0,0,0,.2);--shadow-lg:0 8px 32px rgba(0,0,0,.3);
    --primary-light:#1e3a4a;
  }
  .answer-textarea{background:#1a2332;color:var(--text);border-color:#344556}
  .grade-card .grade-sets{background:#1a2332}
  .btn-secondary{background:#1a2332;border-color:#344556;color:var(--text)}
  .model-answer{background:linear-gradient(135deg,#1a332a,#243a2e)}
  .tips-card{background:linear-gradient(135deg,#332e1a,#3a3424)}
  .illustration-box{border-color:#344556}
}
</style>
</head>
<body>
<div class="app" id="app">
  <!-- Header -->
  <div class="header" id="header">
    <button class="btn-home" id="btnHome" onclick="goHome()" style="display:none">&#8592;</button>
    <h1>英検面接シミュレーター</h1>
    <span class="badge" id="gradeBadge" style="display:none"></span>
  </div>
  <div class="progress-bar" id="progressBar" style="display:none"><div class="fill" id="progressFill"></div></div>

  <!-- Main -->
  <div class="main">

    <!-- HOME SCREEN -->
    <div class="screen active" id="screenHome">
      <div class="home-hero">
        <span class="icon">&#127908;</span>
        <h2>面接シミュレーター</h2>
        <p>英検二次試験の面接練習ができます</p>
      </div>

      <div class="grade-selector">
        <button class="grade-card" data-grade="3" onclick="selectGrade(3)">
          <div class="grade-icon g3">3</div>
          <div class="grade-info">
            <h3>3級</h3>
            <p>音読 + Q&amp;A + イラスト + 個人質問</p>
          </div>
          <span class="grade-sets">10セット</span>
        </button>
        <button class="grade-card" data-grade="p2" onclick="selectGrade('p2')">
          <div class="grade-icon gp2">準2</div>
          <div class="grade-info">
            <h3>準2級</h3>
            <p>音読 + Q&amp;A + イラスト + 意見質問</p>
          </div>
          <span class="grade-sets">8セット</span>
        </button>
        <button class="grade-card" data-grade="2" onclick="selectGrade(2)">
          <div class="grade-icon g2">2</div>
          <div class="grade-info">
            <h3>2級</h3>
            <p>音読 + Q&amp;A + ナレーション + 意見質問</p>
          </div>
          <span class="grade-sets">6セット</span>
        </button>
      </div>

      <button class="btn-start" id="btnStart" disabled onclick="startInterview()">面接をはじめる</button>

      <div class="history-section" id="historySection" style="display:none">
        <h3>最近の練習</h3>
        <div id="historyList"></div>
      </div>
    </div>

    <!-- CARD HANDOUT -->
    <div class="screen" id="screenCardHandout">
      <div class="examiner">
        <div class="examiner-avatar">&#128100;</div>
        <div class="examiner-bubble">
          <div class="label">面接官</div>
          これからカードをわたしますので、まず黙読してください。時間は20秒です。
        </div>
      </div>
      <div class="passage-card" id="passageCardSilent">
        <div class="passage-title" id="passageTitleSilent"></div>
        <div class="passage-text" id="passageTextSilent"></div>
      </div>
      <button class="btn btn-primary btn-full btn-lg" onclick="startSilentReading()">カードを受け取る</button>
    </div>

    <!-- SILENT READING -->
    <div class="screen" id="screenSilentRead">
      <div class="step-indicator" id="stepIndicator1"></div>
      <div class="examiner">
        <div class="examiner-avatar">&#128100;</div>
        <div class="examiner-bubble">
          <div class="label">面接官</div>
          黙読してください。（20秒）
        </div>
      </div>
      <div class="passage-card">
        <div class="passage-title" id="passageTitleRead"></div>
        <div class="passage-text" id="passageTextRead"></div>
      </div>
      <div class="timer-display">
        <div class="timer-circle" id="timerCircle"><span id="timerValue">20</span></div>
        <div class="timer-label">黙読時間</div>
      </div>
    </div>

    <!-- READ ALOUD -->
    <div class="screen" id="screenReadAloud">
      <div class="step-indicator" id="stepIndicator2"></div>
      <div class="examiner">
        <div class="examiner-avatar">&#128100;</div>
        <div class="examiner-bubble">
          <div class="label">面接官</div>
          では、タイトルから声に出して読んでください。
        </div>
      </div>
      <div class="passage-card">
        <div class="passage-title" id="passageTitleAloud"></div>
        <div class="passage-text" id="passageTextAloud"></div>
      </div>
      <div class="answer-area">
        <div style="display:flex;align-items:center;justify-content:center;gap:16px">
          <button class="btn-mic" id="btnMicRead" onclick="toggleSpeechRead()">&#127908;</button>
        </div>
        <div class="speech-status" id="speechStatusRead">マイクボタンを押して音読しよう</div>
        <button class="btn btn-secondary btn-full" id="btnReadDone" onclick="finishReadAloud()">読み終わった</button>
      </div>
    </div>

    <!-- Q&A PHASE -->
    <div class="screen" id="screenQA">
      <div class="step-indicator" id="stepIndicatorQA"></div>
      <div class="examiner" id="examinerQA">
        <div class="examiner-avatar">&#128100;</div>
        <div class="examiner-bubble">
          <div class="label">面接官</div>
          <span id="qaQuestion"></span>
        </div>
      </div>
      <!-- Illustration box (shown for illustration questions) -->
      <div class="illustration-box" id="illustBox" style="display:none">
        <span class="illust-icon">&#128444;</span>
        <div class="illust-desc" id="illustDesc"></div>
      </div>
      <!-- Passage reference (shown for passage Q&A) -->
      <div class="passage-card" id="passageRefCard" style="display:none">
        <div class="passage-title" id="passageTitleRef"></div>
        <div class="passage-text" id="passageTextRef"></div>
      </div>
      <div class="answer-area" id="answerAreaQA">
        <textarea class="answer-textarea" id="answerInput" placeholder="ここに回答を入力...（音声入力も使えます）"></textarea>
        <div class="answer-actions">
          <button class="btn-mic" id="btnMicQA" onclick="toggleSpeechQA()" style="width:44px;height:44px;font-size:1.2rem">&#127908;</button>
          <button class="btn btn-primary" style="flex:1" onclick="submitAnswer()">回答する</button>
          <button class="btn btn-secondary" onclick="showModelAnswer()">こたえを見る</button>
        </div>
        <div class="speech-status" id="speechStatusQA"></div>
      </div>
      <!-- Model Answer (shown after answering) -->
      <div id="modelAnswerBox" style="display:none">
        <div class="model-answer">
          <div class="label">模範回答</div>
          <div class="text" id="modelAnswerText"></div>
          <div class="tips" id="modelAnswerTips"></div>
        </div>
        <div class="self-assess">
          <button class="btn btn-accent" onclick="selfAssess('good')">&#9734; うまく言えた</button>
          <button class="btn btn-warn" onclick="selfAssess('ok')">&#9825; もう少し</button>
        </div>
      </div>
    </div>

    <!-- RESULT SCREEN -->
    <div class="screen" id="screenResult">
      <div class="result-card">
        <h2>面接練習おつかれさまでした！</h2>
        <div class="subtitle" id="resultGradeLabel"></div>
        <div class="big-stars" id="resultStars"></div>
        <div class="subtitle" id="resultScore"></div>
      </div>
      <div class="result-breakdown" id="resultBreakdown"></div>
      <div class="tips-card">
        <h3>&#128161; アドバイス</h3>
        <ul id="resultTips"></ul>
      </div>
      <div class="result-actions">
        <button class="btn btn-primary btn-lg" style="flex:1" onclick="retryInterview()">もう1回</button>
        <button class="btn btn-secondary btn-lg" style="flex:1" onclick="differentSet()">べつの問題</button>
      </div>
      <button class="btn btn-secondary btn-full" onclick="goHome()">ホームに戻る</button>
    </div>

  </div>
</div>

<script>
// ============================================================
// QUESTION DATA - 24 SETS
// ============================================================

const DATA = {
  // ====== 3級 (10 sets) ======
  3: [
    {
      grade:3,
      passage:{
        title:"Enjoying Music",
        text:"Many people enjoy listening to music. Some people listen to music on the train. It makes them feel happy. Music is a wonderful part of our lives."
      },
      passageQuestion:{q:"According to the passage, where do some people listen to music?",modelAnswer:"They listen to music on the train.",tips:"passage の中にある文をそのまま使えばOK"},
      illustrationDesc:"A boy is reading a book under a tree. A girl is playing the piano in a room. A woman is cooking dinner in the kitchen.",

// ============================================================
// APP STATE
// ============================================================
let state = {
  selectedGrade: null,
  currentSet: null,
  currentSetIndex: -1,
  currentStep: 0, // 0=home,1=cardHandout,2=silentRead,3=readAloud,4+=qa
  totalSteps: 0,
  qaIndex: 0,
  qaList: [], // flattened list of QA items
  results: [], // {section, result}
  timerInterval: null,
  recognition: null,
  isRecording: false,
  speechSupported: false,
  ttsSupported: false,
};

// ============================================================
// INIT
// ============================================================
function init() {
  state.speechSupported = 'webkitSpeechRecognition' in window || 'SpeechRecognition' in window;
  state.ttsSupported = 'speechSynthesis' in window;
  if (!state.speechSupported) {
    document.querySelectorAll('.btn-mic').forEach(b => b.style.display = 'none');
  }
  renderHistory();
}

// ============================================================
// NAVIGATION
// ============================================================
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  const el = document.getElementById(id);
  if (el) {
    el.classList.add('active');
    // force re-animation
    el.style.animation = 'none';
    el.offsetHeight;
    el.style.animation = '';
  }
}

function goHome() {
  stopTimer();
  stopRecognition();
  if (state.ttsSupported) speechSynthesis.cancel();
  state.currentStep = 0;
  document.getElementById('btnHome').style.display = 'none';
  document.getElementById('gradeBadge').style.display = 'none';
  document.getElementById('progressBar').style.display = 'none';
  showScreen('screenHome');
  renderHistory();
}

function updateProgress() {
  const bar = document.getElementById('progressBar');
  const fill = document.getElementById('progressFill');
  bar.style.display = 'block';
  const pct = state.totalSteps > 0 ? Math.min(100, ((state.currentStep - 1) / state.totalSteps) * 100) : 0;
  fill.style.width = pct + '%';
}

// ============================================================
// GRADE SELECTION
// ============================================================
function selectGrade(grade) {
  state.selectedGrade = grade;
  document.querySelectorAll('.grade-card').forEach(c => c.classList.remove('selected'));
  document.querySelector(`.grade-card[data-grade="${grade}"]`).classList.add('selected');
  document.getElementById('btnStart').disabled = false;
}

// ============================================================
// START INTERVIEW
// ============================================================
function startInterview() {
  const sets = DATA[state.selectedGrade];
  if (!sets || sets.length === 0) return;

  // Pick a random set (avoid last used if possible)
  const lastIdx = getLastUsedIndex(state.selectedGrade);
  let idx;
  if (sets.length === 1) {
    idx = 0;
  } else {
    do { idx = Math.floor(Math.random() * sets.length); } while (idx === lastIdx);
  }

  state.currentSetIndex = idx;
  state.currentSet = sets[idx];
  state.results = [];
  state.qaIndex = 0;

  // Build QA list
  buildQAList();

  // total steps: silentRead(1) + readAloud(1) + qaList.length
  state.totalSteps = 2 + state.qaList.length;
  state.currentStep = 1;

  // UI
  const gradeLabels = {3:'3級','p2':'準2級',2:'2級'};
  document.getElementById('gradeBadge').textContent = gradeLabels[state.selectedGrade];
  document.getElementById('gradeBadge').style.display = 'inline';
  document.getElementById('btnHome').style.display = 'flex';
  updateProgress();

  // Show card handout
  const s = state.currentSet;
  document.getElementById('passageTitleSilent').textContent = s.passage.title;
  document.getElementById('passageTextSilent').textContent = s.passage.text;
  showScreen('screenCardHandout');
  speak('これからカードをわたしますので、まず黙読してください。時間は20秒です。');
}

function buildQAList() {
  const s = state.currentSet;
  state.qaList = [];

  // 1. Passage question
  state.qaList.push({
    type: 'passage',
    section: 'パッセージQ&A',
    q: s.passageQuestion.q,
    modelAnswer: s.passageQuestion.modelAnswer,
    tips: s.passageQuestion.tips || '',
    showPassage: true
  });

  // 2. Illustration question
  state.qaList.push({
    type: 'illustration',
    section: 'イラストQ&A',
    q: s.illustrationQuestion.q,
    modelAnswer: s.illustrationQuestion.modelAnswer,
    tips: s.illustrationQuestion.tips || '',
    illustrationDesc: s.illustrationDesc
  });

  // 3. Personal/Opinion questions
  if (s.personalQuestions) {
    s.personalQuestions.forEach((pq, i) => {
      state.qaList.push({
        type: 'personal',
        section: `個人質問${i + 1}`,
        q: pq.q,
        modelAnswer: pq.modelAnswer,
        tips: pq.tips || ''
      });
    });
  }
  if (s.opinionQuestions) {
    s.opinionQuestions.forEach((oq, i) => {
      state.qaList.push({
        type: 'opinion',
        section: `意見質問${i + 1}`,
        q: oq.q,
        modelAnswer: oq.modelAnswer,
        tips: oq.tips || ''
      });
    });
  }
}

// ============================================================
// SILENT READING
// ============================================================
function startSilentReading() {
  state.currentStep = 2;
  updateProgress();

  const s = state.currentSet;
  document.getElementById('passageTitleRead').textContent = s.passage.title;
  document.getElementById('passageTextRead').textContent = s.passage.text;

  showScreen('screenSilentRead');
  renderStepIndicator('stepIndicator1');

  // Start 20s timer
  let seconds = 20;
  const timerVal = document.getElementById('timerValue');
  const timerCircle = document.getElementById('timerCircle');
  timerVal.textContent = seconds;
  timerCircle.className = 'timer-circle';

  state.timerInterval = setInterval(() => {
    seconds--;
    timerVal.textContent = seconds;
    if (seconds <= 5) timerCircle.className = 'timer-circle danger';
    else if (seconds <= 10) timerCircle.className = 'timer-circle warning';
    if (seconds <= 0) {
      stopTimer();
      goToReadAloud();
    }
  }, 1000);
}

function stopTimer() {
  if (state.timerInterval) {
    clearInterval(state.timerInterval);
    state.timerInterval = null;
  }
}

// ============================================================
// READ ALOUD
// ============================================================
function goToReadAloud() {
  stopTimer();
  state.currentStep = 3;
  updateProgress();

  const s = state.currentSet;

  // Build word-wrapped passage
  const titleEl = document.getElementById('passageTitleAloud');
  const textEl = document.getElementById('passageTextAloud');
  titleEl.textContent = s.passage.title;

  const words = s.passage.text.split(/\s+/);
  textEl.innerHTML = words.map((w, i) => `<span class="word" data-idx="${i}">${w}</span>`).join(' ');

  showScreen('screenReadAloud');
  renderStepIndicator('stepIndicator2');
  speak('では、タイトルから声に出して読んでください。');

  document.getElementById('speechStatusRead').textContent =
    state.speechSupported ? 'マイクボタンを押して音読しよう' : '声に出して読んだら「読み終わった」を押そう';
}

let readTranscript = '';

function toggleSpeechRead() {
  if (state.isRecording) {
    stopRecognition();
  } else {
    readTranscript = '';
    startRecognition('read');
  }
}

function finishReadAloud() {
  stopRecognition();

  // Highlight matched/missed words
  if (readTranscript) {
    const passageWords = state.currentSet.passage.text.split(/\s+/).map(w => w.toLowerCase().replace(/[^a-z']/g, ''));
    const spokenWords = readTranscript.toLowerCase().split(/\s+/).map(w => w.replace(/[^a-z']/g, ''));

    document.querySelectorAll('#passageTextAloud .word').forEach((el, i) => {
      const pw = passageWords[i];
      if (spokenWords.includes(pw)) {
        el.classList.add('highlight');
      } else {
        el.classList.add('missed');
      }
    });

    // Brief pause to show results
    state.results.push({ section: '音読', result: 'done' });
    setTimeout(() => goToQA(), 1500);
  } else {
    state.results.push({ section: '音読', result: 'done' });
    goToQA();
  }
}

// ============================================================
// Q&A PHASE
// ============================================================
function goToQA() {
  state.qaIndex = 0;
  showCurrentQuestion();
}

function showCurrentQuestion() {
  if (state.qaIndex >= state.qaList.length) {
    showResults();
    return;
  }

  state.currentStep = 3 + state.qaIndex + 1;
  updateProgress();

  const qa = state.qaList[state.qaIndex];

  // Reset UI
  document.getElementById('answerInput').value = '';
  document.getElementById('modelAnswerBox').style.display = 'none';
  document.getElementById('answerAreaQA').style.display = 'flex';
  document.getElementById('qaQuestion').textContent = qa.q;

  // Show/hide illustration
  const illustBox = document.getElementById('illustBox');
  if (qa.type === 'illustration') {
    illustBox.style.display = 'block';
    document.getElementById('illustDesc').textContent = qa.illustrationDesc;
  } else {
    illustBox.style.display = 'none';
  }

  // Show/hide passage reference
  const passRef = document.getElementById('passageRefCard');
  if (qa.showPassage) {
    passRef.style.display = 'block';
    document.getElementById('passageTitleRef').textContent = state.currentSet.passage.title;
    document.getElementById('passageTextRef').textContent = state.currentSet.passage.text;
  } else {
    passRef.style.display = 'none';
  }

  showScreen('screenQA');
  renderStepIndicator('stepIndicatorQA');

  // TTS
  speak(qa.q);
}

function submitAnswer() {
  showModelAnswer();
}

function showModelAnswer() {
  const qa = state.qaList[state.qaIndex];
  document.getElementById('answerAreaQA').style.display = 'none';
  stopRecognition();

  const box = document.getElementById('modelAnswerBox');
  box.style.display = 'block';
  document.getElementById('modelAnswerText').textContent = qa.modelAnswer;
  document.getElementById('modelAnswerTips').textContent = qa.tips ? '💡 ' + qa.tips : '';
  box.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function selfAssess(level) {
  const qa = state.qaList[state.qaIndex];
  state.results.push({
    section: qa.section,
    result: level
  });

  state.qaIndex++;
  if (state.qaIndex < state.qaList.length) {
    showCurrentQuestion();
  } else {
    showResults();
  }
}

// ============================================================
// RESULTS
// ============================================================
function showResults() {
  stopTimer();
  stopRecognition();

  const gradeLabels = {3:'3級','p2':'準2級',2:'2級'};
  document.getElementById('resultGradeLabel').textContent = gradeLabels[state.selectedGrade] + ' 面接練習';

  // Calculate stars
  let goodCount = 0;
  let totalCount = 0;
  state.results.forEach(r => {
    if (r.result === 'good' || r.result === 'ok') totalCount++;
    if (r.result === 'good') goodCount++;
  });

  const ratio = totalCount > 0 ? goodCount / totalCount : 0;
  let stars = 1;
  if (ratio >= 0.8) stars = 5;
  else if (ratio >= 0.6) stars = 4;
  else if (ratio >= 0.4) stars = 3;
  else if (ratio >= 0.2) stars = 2;

  const starStr = '\u2605'.repeat(stars) + '\u2606'.repeat(5 - stars);
  document.getElementById('resultStars').textContent = starStr;
  document.getElementById('resultScore').textContent = `${goodCount} / ${totalCount} セクション「うまく言えた」`;

  // Breakdown
  const breakdown = document.getElementById('resultBreakdown');
  breakdown.innerHTML = '';
  state.results.forEach(r => {
    if (r.result === 'done') return;
    const row = document.createElement('div');
    row.className = 'result-row';
    const cls = r.result === 'good' ? 'good' : 'needs-work';
    const label = r.result === 'good' ? 'うまく言えた' : 'もう少し';
    row.innerHTML = `<span class="section-name">${r.section}</span><span class="section-result ${cls}">${label}</span>`;
    breakdown.appendChild(row);
  });

  // Tips
  const tipsEl = document.getElementById('resultTips');
  const tips = generateTips();
  tipsEl.innerHTML = tips.map(t => `<li>${t}</li>`).join('');

  // Save history
  saveHistory(stars);

  state.currentStep = state.totalSteps;
  updateProgress();
  showScreen('screenResult');
}

function generateTips() {
  const tips = [];
  const hasOk = state.results.some(r => r.result === 'ok');
  const grade = state.selectedGrade;

  if (grade === 3) {
    tips.push('音読はゆっくりはっきり読もう。タイトルも忘れずに。');
    if (hasOk) tips.push('答えるときは、主語 + 動詞のかたちを意識しよう。');
    tips.push('個人質問は Yes/No + もう1文を心がけよう。');
    tips.push('わからないときは "Could you say that again?" と聞き返せるよ。');
  } else if (grade === 'p2') {
    tips.push('パッセージの音読は意味のかたまりで区切って読もう。');
    if (hasOk) tips.push('意見質問は、理由を2つ言えると高得点になるよ。');
    tips.push('イラスト描写は時系列で3つの場面を説明しよう。');
    tips.push('"I think ..." + "because ..." + "Also, ..." のパターンを練習しよう。');
  } else {
    tips.push('パッセージは内容を理解しながら、自然な速さで読もう。');
    if (hasOk) tips.push('意見質問では具体例を入れると説得力が増すよ。');
    tips.push('ナレーションは登場人物の気持ちの変化も描写しよう。');
    tips.push('"For example, ..." や "However, ..." を使って論理的に話そう。');
  }
  return tips;
}

// ============================================================
// RETRY / DIFFERENT SET
// ============================================================
function retryInterview() {
  state.currentSetIndex = state.currentSetIndex; // same set
  state.currentSet = DATA[state.selectedGrade][state.currentSetIndex];
  state.results = [];
  state.qaIndex = 0;
  buildQAList();
  state.totalSteps = 2 + state.qaList.length;
  state.currentStep = 1;
  updateProgress();

  const s = state.currentSet;
  document.getElementById('passageTitleSilent').textContent = s.passage.title;
  document.getElementById('passageTextSilent').textContent = s.passage.text;
  showScreen('screenCardHandout');
  speak('もう一度やってみましょう。カードをわたします。');
}

function differentSet() {
  startInterview();
}

// ============================================================
// SPEECH RECOGNITION
// ============================================================
function startRecognition(mode) {
  if (!state.speechSupported) return;

  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  state.recognition = new SpeechRecognition();
  state.recognition.lang = 'en-US';
  state.recognition.interimResults = true;
  state.recognition.continuous = true;

  state.recognition.onresult = (e) => {
    let transcript = '';
    for (let i = 0; i < e.results.length; i++) {
      transcript += e.results[i][0].transcript;
    }
    if (mode === 'read') {
      readTranscript = transcript;
      document.getElementById('speechStatusRead').textContent = transcript.slice(-80);
      document.getElementById('speechStatusRead').className = 'speech-status active';
    } else {
      document.getElementById('answerInput').value = transcript;
      document.getElementById('speechStatusQA').textContent = '音声認識中...';
      document.getElementById('speechStatusQA').className = 'speech-status active';
    }
  };

  state.recognition.onerror = (e) => {
    console.log('Speech error:', e.error);
    if (e.error !== 'no-speech') {
      stopRecognition();
    }
  };

  state.recognition.onend = () => {
    if (state.isRecording) {
      // Restart if still recording
      try { state.recognition.start(); } catch(e) {}
    }
  };

  try {
    state.recognition.start();
    state.isRecording = true;
    updateMicUI(mode, true);
  } catch(e) {
    console.error('Speech start error:', e);
  }
}

function stopRecognition() {
  state.isRecording = false;
  if (state.recognition) {
    try { state.recognition.stop(); } catch(e) {}
    state.recognition = null;
  }
  updateMicUI('read', false);
  updateMicUI('qa', false);
}

function updateMicUI(mode, active) {
  if (mode === 'read') {
    const btn = document.getElementById('btnMicRead');
    const status = document.getElementById('speechStatusRead');
    btn.classList.toggle('recording', active);
    if (!active && status) {
      status.className = 'speech-status';
      if (!readTranscript) status.textContent = 'マイクボタンを押して音読しよう';
    }
  } else {
    const btn = document.getElementById('btnMicQA');
    const status = document.getElementById('speechStatusQA');
    btn.classList.toggle('recording', active);
    if (!active && status) {
      status.className = 'speech-status';
      status.textContent = '';
    }
  }
}

function toggleSpeechQA() {
  if (state.isRecording) {
    stopRecognition();
  } else {
    startRecognition('qa');
  }
}

// ============================================================
// TEXT-TO-SPEECH
// ============================================================
function speak(text) {
  if (!state.ttsSupported) return;
  speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);

  // Detect language
  const isJapanese = /[\u3000-\u303f\u3040-\u309f\u30a0-\u30ff\u4e00-\u9faf]/.test(text);
  utter.lang = isJapanese ? 'ja-JP' : 'en-US';
  utter.rate = isJapanese ? 1.0 : 0.85;
  utter.pitch = 1.0;

  // Try to pick a good voice
  const voices = speechSynthesis.getVoices();
  if (voices.length > 0) {
    const lang = utter.lang;
    const preferred = voices.find(v => v.lang.startsWith(lang.split('-')[0]) && v.localService);
    if (preferred) utter.voice = preferred;
  }

  speechSynthesis.speak(utter);
}

// ============================================================
// STEP INDICATOR
// ============================================================
function renderStepIndicator(containerId) {
  const el = document.getElementById(containerId);
  if (!el) return;

  const totalDots = state.totalSteps;
  const currentDot = state.currentStep - 1;
  const sectionLabels = {3:'3級','p2':'準2級',2:'2級'};

  let html = '';
  for (let i = 0; i < totalDots; i++) {
    let cls = 'step-dot';
    if (i === currentDot) cls += ' active';
    else if (i < currentDot) cls += ' done';
    html += `<div class="${cls}"></div>`;
  }
  html += `<span class="step-label">ステップ ${state.currentStep}/${state.totalSteps}</span>`;
  el.innerHTML = html;
}

// ============================================================
// LOCAL STORAGE - HISTORY
// ============================================================
function getStorageKey() {
  return 'eiken-interview-history';
}

function getHistory() {
  try {
    return JSON.parse(localStorage.getItem(getStorageKey())) || [];
  } catch { return []; }
}

function saveHistory(stars) {
  const history = getHistory();
  const gradeLabels = {3:'3級','p2':'準2級',2:'2級'};
  history.unshift({
    grade: gradeLabels[state.selectedGrade],
    stars,
    date: new Date().toLocaleDateString('ja-JP'),
    setIndex: state.currentSetIndex
  });
  // Keep last 20
  if (history.length > 20) history.length = 20;
  localStorage.setItem(getStorageKey(), JSON.stringify(history));
  setLastUsedIndex(state.selectedGrade, state.currentSetIndex);
}

function getLastUsedIndex(grade) {
  try {
    const data = JSON.parse(localStorage.getItem('eiken-interview-last')) || {};
    return data[grade] ?? -1;
  } catch { return -1; }
}

function setLastUsedIndex(grade, idx) {
  try {
    const data = JSON.parse(localStorage.getItem('eiken-interview-last')) || {};
    data[grade] = idx;
    localStorage.setItem('eiken-interview-last', JSON.stringify(data));
  } catch {}
}

function renderHistory() {
  const history = getHistory();
  const section = document.getElementById('historySection');
  const list = document.getElementById('historyList');

  if (history.length === 0) {
    section.style.display = 'none';
    return;
  }

  section.style.display = 'block';
  list.innerHTML = history.slice(0, 5).map(h => {
    const starStr = '\u2605'.repeat(h.stars) + '\u2606'.repeat(5 - h.stars);
    return `<div class="history-row">
      <span>${h.grade}</span>
      <span class="stars">${starStr}</span>
      <span class="date">${h.date}</span>
    </div>`;
  }).join('');
}

// ============================================================
// VOICE LOADING
// ============================================================
if (state.ttsSupported) {
  speechSynthesis.onvoiceschanged = () => {};
  // Pre-load voices
  speechSynthesis.getVoices();
}

// ============================================================
// INIT
// ============================================================
init();
</script>
</body>
</html>
